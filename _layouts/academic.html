<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#fafbf8">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lixian Chen | {{ page.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:image" content="{{ '/images/name.jpg' | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <title>Lixian Chen | {{ page.title | escape }}</title>
  <link rel="icon" href="{{ '/assets/academic/pikachu.svg' | relative_url }}" type="image/svg+xml">
  <script>try{var theme=localStorage.getItem('lixian-theme');if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;}catch(e){}</script>
  <link rel="stylesheet" href="{{ '/assets/academic/styles.css' | relative_url }}">
  <script src="{{ '/assets/academic/theme.js' | relative_url }}" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="shell header-row">
    <a class="wordmark" href="{{ '/' | relative_url }}"><span aria-hidden="true" class="wordmark-dot"></span>Lixian Chen</a>
    <div class="header-actions">
      <nav aria-label="Main navigation"><a href="{{ '/#education' | relative_url }}">Education</a><a href="{{ '/#news' | relative_url }}">News</a><a href="{{ '/#publications' | relative_url }}">Publications</a></nav>
      <button class="theme-button" type="button" aria-label="Switch to dark theme" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 14a8.5 8.5 0 0 1-10-10A8.5 8.5 0 1 0 20 14Z"/></svg></button>
    </div>
  </div></header>
  <main class="shell main-content" id="main">{{ content }}</main>
  <footer class="shell site-footer"><p>&copy; {{ site.time | date: '%Y' }} Lixian Chen</p><div><a href="mailto:{{ site.author.email }}">Email</a><a href="{{ site.author.googlescholar }}">Google Scholar</a><a href="#top">Back to top ↑</a></div></footer>
</body>
</html>
